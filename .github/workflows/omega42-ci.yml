name: omega42-ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reference implementation self-test (Core Part 11)
        run: python3 scripts/canonical_reference.py --test
      - name: SCRIPT SHA-256 matches the value stated in Core Part 11 (L-417)
        run: |
          python3 scripts/canonical_reference.py --version | grep "ab79aae2d027968deab809e1bd7963e6ec32ac4a9754c8fc250071bebc0514c5"
      - name: MATH-GATE (Core Part 1.14, L-451)
        run: python3 scripts/canonical_reference.py --mathgate
      - name: Canonical selection witness (Core Part 1.8.4)
        run: |
          python3 scripts/canonical_reference.py --canonical-selection | grep "SELECTION SHA-256: ba66020c2bc22f951f2c008efdddfdf7d75c9c27af8fbbe3fc7b5d713178d4ed" > /dev/null
      - name: M193 / M225 / M243a / L-431 / M224-A self-test
        run: |
          python3 scripts/m193_m225.py scripts/canonical_reference.py --selftest | tee selftest.txt
          ! grep -q MISMATCH selftest.txt
      - name: Media calibration (M211-AV)
        run: |
          python3 scripts/canonical_reference_av.py --calibrate-av | grep "CALIBRATION-AV: PASS"
      - name: CRC-60 corpus freeze reproduces the published hash (Companion 24.4)
        run: python3 scripts/crc60_and_m267.py scripts/canonical_reference.py freeze | grep "a85469792e7fc1ce3efcb921e32adc1bf25d7faefc204d609ca5c1113ac3e622"
      - name: Output audit, worked example (Core Part 8.0, L-457)
        run: python3 scripts/m193_m225.py scripts/canonical_reference.py --audit examples/worked_navigation.txt
      - name: Output audit, model opening (Core Part 2 Opening Response, L-458)
        run: python3 scripts/m193_m225.py scripts/canonical_reference.py --audit examples/model_opening.txt
      - name: Overlap check catches a contaminated navigation (L-459)
        run: |
          ! python3 scripts/m193_m225.py scripts/canonical_reference.py --audit examples/contaminated_navigation.txt --corpus examples/corpus
      - name: Alternative Ground Challenge and Reconstruction Programme (Companion Part 37, L-461)
        run: python3 scripts/ground_challenge.py --test
      - name: Audit every submitted navigation (submissions/, L-457, L-459)
        run: |
          shopt -s nullglob
          for f in submissions/*.txt; do
            echo "Auditing $f"
            python3 scripts/m193_m225.py scripts/canonical_reference.py --audit "$f" --corpus examples/corpus || exit 1
          done
      - name: Cross-document consistency register (Core Rule 11)
        run: python3 tools/consistency_check.py docs/Omega42_Core_Specification_V335_Rev450_STABLE.docx docs/Omega42_Companion_Document_V335_Rev450_STABLE.docx --scripts scripts --ground-test 48 --ref-test 59
