        run: |
          echo "6bad77b8a5c471be57ddfe0ea303b617c0e9135920d4d243bf0aef373b7a3545  records/EPR_M279.txt" | sha256sum -c
          echo "a150f9ee68e666f1ee90961aebbc7a80f641d6db3358ef14852ad3723464a7db  records/EPR_M280.txt" | sha256sum -c
      - name: Comparative annex (optional, L-491) -- Experiment runner self-test (M279, M280; records/EPR_*)
        run: python3 tools/epr_run.py --selftest
      - name: Lite view renders only from an audited navigation (Core Part 8.0)
        run: |
          python3 tools/lite_view.py examples/worked_navigation.txt > /dev/null
          ! python3 tools/lite_view.py examples/contaminated_navigation.txt --corpus examples/corpus > /dev/null
