          python3 - <<'PY'
          import glob, hashlib, json, sys
          bad = 0
          for m in glob.glob('submissions/navigations/*.json'):
              meta = json.load(open(m)); t = m[:-5] + '.txt'
              if hashlib.sha256(open(t, 'rb').read()).hexdigest() != meta['sha256']:
