name: intake
# Public submission intake (CONTRIBUTING.md). The issue body is read as data by tools/intake.py from the event file;
# nothing from the issue is interpolated into a shell command or executed.
on:
  issues:
    types: [opened, edited, labeled]
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: intake-${{ github.event.issue.number }}
jobs:
  check:
    if: (github.event.action == 'opened' || github.event.action == 'edited') && (contains(github.event.issue.labels.*.name, 'submission') || contains(github.event.issue.labels.*.name, 'credentials') || contains(github.event.issue.labels.*.name, 'registration'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Automatic checks
        run: python3 tools/intake.py check "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/intake"
      - name: Reply on the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/intake/comment.md"
          if gh issue view "$NUMBER" --json labels -q '.labels[].name' | grep -qE '^(navigation|ape|review)$'; then
            gh issue edit "$NUMBER" --add-label needs-review
          fi
  accept:
    # A maintainer accepts by adding the label `accepted` (or `verified` on a credentials issue).
    if: github.event.action == 'labeled' && (github.event.label.name == 'accepted' || (github.event.label.name == 'verified' && contains(github.event.issue.labels.*.name, 'credentials')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the submission into the record
        run: python3 tools/intake.py accept "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/accept"
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          ID=$(cat "$RUNNER_TEMP/accept/id")
          git config user.name "omega42-intake[bot]"
          git config user.email "intake@users.noreply.github.com"
          git checkout -b "intake/$ID"
          git add -A submissions records community
          git commit -s -m "Accept #$NUMBER as $ID"
          git push origin "intake/$ID"
          gh pr create --title "Accept $ID (#$NUMBER)" --body-file "$RUNNER_TEMP/accept/pr_body.md" --label intake
          gh issue comment "$NUMBER" --body "Accepted as **$ID**. It enters the public record when the pull request is merged."
