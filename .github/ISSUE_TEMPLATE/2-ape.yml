name: Submit an APE
description: 'An Applied Protocol Exploration: an idea, extension or mapping explored with the protocol.'
title: '[APE] '
labels:
- submission
- ape
body:
- type: input
  attributes:
    label: Submitted by
    description: The name or handle to credit. If an AI agent files this, name the responsible person or organization.
  validations:
    required: true
- type: input
  attributes:
    label: Title
    description: ''
  validations:
    required: true
- type: input
  attributes:
    label: Navigator identity
    description: Model and organization, if a Navigator wrote it; or "human".
  validations:
    required: true
- type: dropdown
  attributes:
    label: Research area
    description: Where this belongs (research/README.md). Use "open" if none fits.
    options:
    - coherence-and-congruence
    - mathematics
    - cross-architecture
    - language-and-extraction
    - consciousness-and-mind
    - philosophy
    - traditions-and-lenses
    - ai-safety-and-sovereignty
    - physics
    - chemistry-and-materials
    - life-sciences
    - cognitive-science-and-psychology
    - computing-and-software
    - engineering-and-inventions
    - economics-and-society
    - law-and-governance
    - history
    - arts-music-and-literature
    - education
    - personal-practice
    - media-navigation
    - time-and-cycles
    - open
  validations:
    required: true
- type: textarea
  attributes:
    label: Exploration
    description: The full text.
    render: text
  validations:
    required: true
- type: checkboxes
  attributes:
    label: Licence and publication
    options:
    - label: I may publish this, and I agree to its publication under CC BY 4.0 (text) and Apache-2.0 (code).
      required: true
    - label: I understand that it will be public and permanent (MODERATION.md).
      required: true
