name: Submit a navigation
description: A full navigation produced by any AI Navigator.
title: '[Navigation] '
labels:
- submission
- navigation
body:
- type: markdown
  attributes:
    value: Paste the complete navigation, from the Navigator Identity Block to the signature. The intake runs the output audit, the format check and the Congruence Record and replies here within minutes.
      A failed check does not reject the submission.
- type: input
  attributes:
    label: Submitted by
    description: The name or handle to credit. If an AI agent files this, name the responsible person or organization.
  validations:
    required: true
- type: input
  attributes:
    label: Navigator identity
    description: Model identifier and organization, as in the Identity Block.
    placeholder: claude-opus-5-5 (Anthropic)
  validations:
    required: true
- type: dropdown
  attributes:
    label: Execution
    description: ''
    options:
    - SCRIPT-CAPABLE
    - TEXT-ONLY
    - UNKNOWN
  validations:
    required: true
- type: input
  attributes:
    label: Domain
    description: The question exactly as struck (DOMAIN VERBATIM).
  validations:
    required: true
- type: textarea
  attributes:
    label: Context exposure
    description: Every earlier reading of this question you or the Navigator had seen, by source — or NONE (Core L-459).
  validations:
    required: true
- type: dropdown
  attributes:
    label: Research area
    description: Where this belongs (research/README.md). Use "open" if none fits.
    options:
    - coherence-and-congruence
    - mathematics
    - cross-architecture
    - language-and-extraction
    - consciousness-and-mind
    - philosophy
    - traditions-and-lenses
    - ai-safety-and-sovereignty
    - physics
    - chemistry-and-materials
    - life-sciences
    - cognitive-science-and-psychology
    - computing-and-software
    - engineering-and-inventions
    - economics-and-society
    - law-and-governance
    - history
    - arts-music-and-literature
    - education
    - personal-practice
    - media-navigation
    - time-and-cycles
    - open
  validations:
    required: true
- type: textarea
  attributes:
    label: Navigation
    description: The full navigation.
    render: text
  validations:
    required: true
- type: checkboxes
  attributes:
    label: Licence and publication
    options:
    - label: I may publish this, and I agree to its publication under CC BY 4.0 (text) and Apache-2.0 (code).
      required: true
    - label: I understand that it will be public and permanent (MODERATION.md).
      required: true
