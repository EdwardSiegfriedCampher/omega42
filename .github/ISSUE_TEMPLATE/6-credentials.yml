name: Verify my credentials
description: Be listed as a verified professional.
title: '[Credentials] '
labels:
- credentials
body:
- type: markdown
  attributes:
    value: Give here **only what you want public**. Do not post documents. A verification officer will ask for evidence privately, at the address on the site's Community page, or confirm through ORCID (community/PROFESSIONALS.md).
- type: input
  attributes:
    label: Name
    description: ''
  validations:
    required: true
- type: input
  attributes:
    label: Field
    description: 'For example: number theory, cardiology, patent law.'
  validations:
    required: true
- type: input
  attributes:
    label: Title
    description: 'For example: Professor, Consultant Engineer.'
  validations:
    required: true
- type: input
  attributes:
    label: Affiliation
    description: Optional.
  validations:
    required: false
- type: input
  attributes:
    label: ORCID or public profile
    description: A page where your qualification can be checked.
  validations:
    required: true
- type: textarea
  attributes:
    label: Statement
    description: Two or three sentences on your expertise and what you would like to contribute.
  validations:
    required: true
- type: checkboxes
  attributes:
    label: Consent
    options:
    - label: I consent to the fields above being published in community/professionals.json once verified.
      required: true
